[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mitrity"
dynamic = ["version"]
description = "MITRITY governance adapter for Python agents: Claude Agent SDK and LangChain integrations for the MITRITY edge (admission API and gateway)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MITRITY AB", email = "hello@mitrity.com" }]
keywords = ["mitrity", "governance", "agents", "claude-agent-sdk", "langchain", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
claude-agent-sdk = ["claude-agent-sdk>=0.2.157"]
langchain = ["langchain-core>=1.0"]
dev = [
  "anyio>=4.4",
  "claude-agent-sdk>=0.2.157",
  "langchain-core>=1.0",
  "mypy>=1.14",
  "pytest>=8.4",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://mitrity.com"
Source = "https://github.com/mitrity-io/mitrity-python"
Contract = "https://github.com/mitrity-io/iag-specs/blob/main/sentinel/adapters.md"

[tool.hatch.version]
path = "src/mitrity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mitrity"]

[tool.hatch.build.targets.sdist]
include = ["src/mitrity", "tests", "README.md", "LICENSE", "SECURITY.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PL", "T20", "S"]
ignore = [
  "PLR0913", # explicit keyword arguments are the public API
  "PLR2004", # magic values in tests and wire constants
  "S101",    # assert is how tests assert
  "S603",    # subprocess without shell, deliberate in tests
  "S108",    # /tmp paths in tests
  "S105",    # `token_file` is a path to a token, not a token
  "S106",    # same, as a keyword argument
  "N818",    # the exception names are the contract's (AdmissionUnreachable, AdmissionTimeout, ...)
  "RUF001",  # prose and test vectors use dashes and non-ASCII on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415", "S104", "SIM117"]
".github/scripts/**" = ["T20"] # release_check.py reports to the console on purpose

[tool.ruff.lint.isort]
known-first-party = ["mitrity"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["claude_agent_sdk.*", "langchain_core.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = ["error::DeprecationWarning:mitrity.*"]
