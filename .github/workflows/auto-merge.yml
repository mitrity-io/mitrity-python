name: Auto-merge Gate

# Arms (or disarms) auto-merge for a PR after a review agent finishes. It is a
# workflow_run workflow: it executes the DEFAULT branch's definition and the
# default branch's copy of .github/scripts/automerge-gate.sh, with the merge
# token — so nothing a PR puts on its own head can arm its own merge. The
# review workflows themselves hold no merge token.
#
# Both review agents post as github-actions[bot], so GitHub's own review
# decision only reflects whichever agent reviewed last; the gate script checks
# the latest review of every required agent against the PR's current head and
# disarms whenever that is not an approval.

on:
  workflow_run:
    workflows: ["Code Review Agent", "Security Review Agent"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    # Only review runs of pull requests from this repository carry a PR number;
    # fork PRs never reach the merge token.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Evaluate the reviews and arm or disarm auto-merge
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          for PR in $PR_NUMBERS; do
            echo "== PR #$PR =="
            PR="$PR" bash .github/scripts/automerge-gate.sh
          done
