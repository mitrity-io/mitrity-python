name: Release

# Publishes a tagged commit of main to PyPI and attaches the distributions to a
# GitHub Release. PyPI authenticates the workflow itself (trusted publishing over
# OIDC); no PyPI token exists anywhere.
#
#   build    verifies the tag, builds sdist + wheel, twine-checks them   contents: read
#   publish  uploads exactly the artifacts build produced                environment pypi, id-token: write
#   release  creates the GitHub Release, changelog section as notes     contents: write
#
# The OIDC token is only minted in publish, which runs no project or third-party
# code: no checkout, no pip install, only the download of build's artifacts. The
# release comes last, so nothing is announced for a version that failed to publish.
# The maintainer checklist and the per-release steps are in RELEASING.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ancestry check below needs main's history
          persist-credentials: false

      - name: Verify the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$TAG points at $commit, which is not on main; only reviewed commits on main are released"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify the tag matches the package version and has a changelog entry
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_check.py --notes-file release-notes.md

      - name: Install the build tooling
        # Exact pins on purpose: a release must not pick up whatever is newest that day.
        run: python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the distributions
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          python -m twine check --strict dist/*
          ls -l dist/
          # What publish uploads is dist/ as a whole: it must hold the tagged version and nothing else.
          for file in dist/*; do
            case "$(basename "$file")" in
              "mitrity-$VERSION.tar.gz" | "mitrity-$VERSION-"*.whl) ;;
              *) echo "::error::unexpected distribution $file (expected mitrity-$VERSION only)"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/mitrity/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: PyPI verifies this job's OIDC token; there is no API token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Uploads dist/*, re-runs twine check on it (verify-metadata) and publishes
      # PEP 740 attestations (attestations: true, the default).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  release:
    name: GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - name: Create the release with the distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The tag came from a release published on GitHub: keep its notes, attach the assets.
            gh release upload "$TAG" --clobber dist/*
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}" dist/*
          fi
